[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-tested-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "langgraph>=1,<2", "trace-sdk==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/bank_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
trace-sdk = { path = "../vendor/trace-sdk" }
